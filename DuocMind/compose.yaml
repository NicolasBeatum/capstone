services:
  app:
    build:
      context: .
    command: ["sh", "-c", "npm ci --prefer-offline && exec npx expo start --web --host lan --clear"]
    ports:
      - "8081:8081"
    environment:
      BROWSER: "none"
      EXPO_NO_TELEMETRY: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
